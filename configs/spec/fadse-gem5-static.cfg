# FADSE/gem5 overlay for SPEC CPU 2026's shipped GCC x86 configuration.
#
# Copy this file next to Example-gcc-linux-x86.cfg in the installed suite's
# config directory. Pass the GCC installation prefix with:
#
#   runcpu --define gcc_dir="$GCC_ROOT" --config=fadse-gem5-static ...
#
# The official example retains ownership of compiler selection and benchmark
# portability flags. This overlay changes only the execution model and common
# base flags required by the single-core gem5 syscall-emulation workflow.

%ifndef %{gcc_dir}
%   error Define gcc_dir with --define gcc_dir="$GCC_ROOT"
%endif

include: Example-gcc-linux-x86.cfg

default:
   label                   = fadsegem5static
   reportable              = 0
   copies                  = 1
   threads                 = 1
   preENV_LC_ALL           = C
   preENV_OMP_THREAD_LIMIT = 1

default=base:
   OPTIMIZE = -g -O3 -march=x86-64 -mtune=generic -static

# Keep the shipped threading flags for OpenMP and C++ std::thread workloads.
# Limit the example's DO CONCURRENT transformation to one worker as well.
doconcurrent:
   EXTRA_FOPTIMIZE = -ftree-parallelize-loops=1
